version: '3.8'

services:
  cloudvmx-backend:
    build:
      context: ./cloudvmx-backend (3)/cloudvmx-backend
      dockerfile: dockerfile
    container_name: cloudvmx-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - cloudvmx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudvmx-client:
    build:
      context: ./cloudvmx/cloudvmx-client
      dockerfile: Dockerfile
    container_name: cloudvmx-client
    ports:
      - "3000:3000"
    depends_on:
      cloudvmx-backend:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - BACKEND_URL=http://cloudvmx-backend:8080
    networks:
      - cloudvmx-network
    restart: unless-stopped

networks:
  cloudvmx-network:
    driver: bridge
